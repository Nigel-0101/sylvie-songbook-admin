<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'"><title>希尔薇 · 歌单管理</title><link rel="icon" href="data:,"><style>:root{font:15px/1.65 Inter,"Microsoft YaHei",system-ui,sans-serif;color:#213d3e;background:#f5f6f0;font-variant-numeric:lining-nums tabular-nums;--ink:#264b46;--line:#d4dfd5;--red:#924a3a}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button,a,input,textarea{outline-offset:4px}button{cursor:pointer;border:1px solid #a6bdb0;border-radius:7px;padding:9px 17px;background:#fffdf6;color:#2b4d49;transition:background .15s}button:hover:enabled{background:#e5eee1}button:disabled{opacity:.45;cursor:default}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.primary:hover:enabled{background:#173e35}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}.top{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:#edf2e6}.brand{font:600 24px/1.3 Georgia,"SimSun",serif;display:flex;align-items:baseline;gap:14px}.brand em{font-size:17px;font-weight:400}.brand span{font:14px/1.5 system-ui,sans-serif;margin-left:18px;padding-left:24px;border-left:1px solid #9eb4a4;color:#536d67}main{max-width:1180px;margin:48px auto;padding:0 32px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.eyebrow{font-size:11px;letter-spacing:.24em;color:var(--red);margin:0 0 10px}h1{font:500 34px/1.4 Georgia,"SimSun",serif;letter-spacing:.06em;margin:0}#sync{font-size:14px;color:#607771;margin:10px 0 0}.actions{display:flex;gap:10px}.workspace{background:#fffefa;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 14px 40px #263c3310}.toolbar{display:flex;align-items:center;gap:12px;padding:22px 25px 16px}.search{flex:1}.search input{width:100%;border:1px solid #b9cbbf;border-radius:6px;padding:12px 15px;background:#f6f8f0}.tabs{display:flex;align-items:center;gap:26px;padding:0 25px;border-bottom:1px solid var(--line)}.tabs button{border:0;border-radius:0;background:none;padding:13px 0;color:#5d706a}.tabs button.active{color:var(--red);box-shadow:inset 0 -2px var(--red);font-weight:600}.tabs button span{font-size:13px;margin-left:8px}.hint{margin-left:auto;color:#718278;font-size:13px}.bulkbar{display:flex;align-items:center;gap:12px;padding:15px 25px;color:#536e65;font-size:13px;background:#f4f7ef}.bulkbar button{padding:4px 10px;font-size:13px}#results{margin-left:auto}input[type=checkbox]{accent-color:var(--ink);width:17px;height:17px;vertical-align:middle}.row{display:grid;grid-template-columns:22px 42px minmax(0,1fr) 150px 124px;gap:14px;align-items:center;padding:18px 25px;border-bottom:1px solid #e2e8df}.row:hover{background:#f7f9f2}.number{font-size:13px;color:#6e8379}.song strong{display:block;font-size:16px;font-weight:600;overflow-wrap:anywhere}.song small{font-size:14px;color:#678074}.meta{font-size:13px;color:#5c7969}.meta span+span::before{content:' · '}.row-actions{display:flex;justify-content:flex-end;gap:8px}.row-actions button{padding:5px 10px;font-size:13px}.new{font-size:10px;color:var(--red);border:1px solid #b47b62;margin-left:9px;padding:1px 4px;vertical-align:middle;font-weight:500}.pagination{display:flex;gap:20px;align-items:center;justify-content:center;padding:20px}.pagination span{color:#6d7f72;font-size:13px}.foot{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:22px 0;color:#6a7e73;font-size:12px}.foot button{font-size:12px;padding:5px 12px}.notice,.error{padding:12px 18px;border-radius:7px;margin:18px 0}.notice{background:#e1efda;color:#315637}.error{background:#fff0e8;color:#923d2b;border:1px solid #e3b5a0}.empty{text-align:center;padding:40px;color:#627e70}dialog{border:1px solid #aac1b2;border-radius:13px;padding:28px;width:min(530px,calc(100% - 28px));max-height:90dvh;background:#fdfef6;color:#24483e;box-shadow:0 28px 80px #183b3940}dialog::backdrop{background:#1637398c;backdrop-filter:blur(4px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}h2{font:500 27px/1.4 Georgia,"SimSun",serif;margin:0}.close{border:0;font-size:27px;padding:0 10px;background:none}form>label,.form-grid label{display:flex;flex-direction:column;gap:7px;margin-bottom:17px;font-size:14px;font-weight:600}form input,textarea{border:1px solid #b1c5b5;background:white;border-radius:6px;width:100%;padding:11px 12px;color:#25433a;font-weight:400}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.dialog-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}.form-error{font-size:14px;color:#a13d2d}.help{font-size:14px;color:#5d7566;margin-bottom:20px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}
@media(max-width:720px){.top{height:65px;padding:0 18px;font-size:12px}.brand{font-size:21px;gap:8px}.brand span{display:none}main{margin:25px auto;padding:0 14px}.heading{display:block;margin-bottom:22px}h1{font-size:28px}.actions{margin-top:20px}.toolbar{padding:15px;gap:8px;flex-wrap:wrap}.search{flex-basis:100%}.toolbar button{font-size:13px;padding:6px 12px}.tabs{padding:0 15px;gap:22px}.hint{display:none}.bulkbar{padding:12px 15px;font-size:12px;gap:8px}.row{padding:15px;grid-template-columns:18px 27px minmax(0,1fr) 63px;gap:9px}.meta{display:none}.row-actions{flex-direction:column;gap:6px}.row-actions button{padding:5px 7px}.song strong{font-size:15px}.song small{font-size:13px}.number{font-size:11px}.foot{align-items:flex-start}.foot span{max-width:64%}.foot button{white-space:nowrap}dialog{padding:22px}.form-grid{gap:12px}}

.trial{border-left:3px solid #8a6b49;background:#f0eadf;padding:12px 18px;margin:22px 0;font-size:14px;color:#5f503f}.link-copy input{width:100%;padding:10px;margin:10px 0;font:14px monospace;}</style></head><body>
<header class="top"><a href="https://vvsings.com/" target="_blank" rel="noreferrer" class="brand">希尔薇 <em>Sylvie</em><span>歌单管理</span></a><a href="https://vvsings.com/#catalog" target="_blank" rel="noreferrer">查看网站 ↗</a></header>
<main><section class="heading"><div><p class="eyebrow">SONGBOOK STUDIO</p><h1>整理下一场的歌声</h1><p id="sync" role="status">正在连接云端…</p></div><div class="actions"><button id="import" disabled>批量导入</button><button class="primary" id="add" disabled>＋ 添加歌曲</button></div></section>
<p class="trial">已连接正式网站 vvsings.com。保存后等待“已发布”，网站会自动读取更新。</p><div class="notice" id="notice" role="status" hidden></div><div class="error" id="error" role="alert" hidden></div>
<section class="workspace" aria-label="管理歌单"><div class="toolbar"><label class="search"><span class="sr-only">搜索歌名、歌手或编号</span><input type="search" id="search" placeholder="搜索歌名、歌手或编号" autocomplete="off"></label><button id="refresh">刷新</button><button id="backup" disabled>导出备份</button></div>
<div class="tabs"><button class="active" id="active-tab">全部歌曲 <span id="count">0</span></button><button id="trash-tab">回收站 <span id="trash-count">0</span></button><span class="hint">新歌置顶 7 天</span></div>
<div class="bulkbar"><label><input type="checkbox" id="select-page"> 选择本页</label><button id="bulk" disabled>移入回收站</button><span id="results"></span></div>
<div id="rows" class="rows"></div><p class="empty" id="empty" hidden>没有找到歌曲，试试其他关键词。</p>
<footer class="pagination"><button id="prev" disabled>上一页</button><span id="page">1 / 1</span><button id="next" disabled>下一页</button></footer></section>
<footer class="foot"><span>歌单保存在云端，多台设备共用。收藏仍属于观众各自的浏览器。</span><button id="copy-link">复制管理链接</button></footer><div id="link-copy" class="link-copy notice" hidden><label for="link-value">复制下方完整链接，并保存到自己的书签中</label><input id="link-value" readonly autocomplete="off" spellcheck="false"><button id="link-hide">收起链接</button></div></main>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title">添加歌曲</h2><button type="button" class="close" data-close="editor" aria-label="关闭">×</button></div><label>歌名<input name="name" required maxlength="180"></label><label>歌手<input name="singer" required maxlength="180"></label><div class="form-grid"><label>语言<input name="language" maxlength="40" list="languages"></label><label>曲风<input name="style" maxlength="40" list="styles"></label></div><datalist id="languages"></datalist><datalist id="styles"></datalist><p class="form-error" id="edit-error" role="alert"></p><div class="dialog-actions"><button type="button" data-close="editor">取消</button><button class="primary" id="save">保存到云端</button></div></form></dialog>
<dialog id="importer"><form id="import-form"><div class="dialog-head"><h2>批量导入</h2><button type="button" class="close" data-close="importer" aria-label="关闭">×</button></div><p class="help">从表格复制“歌名、歌手、语言、曲风”四列，后两列可留空。也可粘贴导出的 JSON 歌单。同名同歌手会自动跳过。</p><textarea id="batch" rows="10" required placeholder="歌名&#9;歌手&#9;语言&#9;曲风"></textarea><p class="form-error" id="import-error" role="alert"></p><div class="dialog-actions"><button type="button" data-close="importer">取消</button><button class="primary" id="import-save">导入到云端</button></div></form></dialog>
<script type="module" src="./admin.js"></script></body></html>
